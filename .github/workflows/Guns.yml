      # ------------------------------------------------------------------
      # 4. Ресурс-пак (геометрия, текстуры, attachable, звуки, lang) -> guns_pack.zip внутри jar
      # ------------------------------------------------------------------
      - name: Generate resource pack
        env:
          RUN_NUMBER: ${{ github.run_number }}
          HOLD_PRESET: ${{ github.event.inputs.hold_preset || '1' }}
        run: |
          set -e
          cat > staging/gen_pack.py <<'PY_EOF'
          import json, os, math, random, struct, zlib, wave, zipfile

          RUN = os.environ.get("RUN_NUMBER", "1")
          PACK_UUID = "5d1c7a3e-2b64-4f0a-9e8d-71a3c4b2f6e1"
          MODULE_UUID = "c8e2f4a6-9b13-4d57-a0c1-3f6e8d2b5a74"
          VERSION = [1, 0, int(RUN)]
          OUT = "pack"

          # ===================================================================
          # ПОЛОЖЕНИЕ В РУКЕ.
          # Пресет выбирается при запуске workflow (вход hold_preset, 1-4) или переменной HOLD_PRESET.
          #   rot - поворот [x, y, z] в градусах: first = первое лицо, third = третье лицо.
          # Для каждого оружия:
          #   GRIP  - центр рукояти в координатах модели; он совмещается с точкой руки (учитывает поворот и размер)
          #   SCALE - размер в руке
          #   EXTRA - ручная добавка к позиции для финальной подгонки: first / third = [x, y, z]
          # Ничего из этого в игре не проверено. Если оружие смотрит не туда, пересоберите с другим пресетом;
          # если направление верное, но смещено или велико, правьте EXTRA и SCALE.
          # ===================================================================
          PRESETS = {
              "1": {"third": [0, 0, 0],   "first": [-90, 0, 0]},   # ствол вперёд; от первого лица ствол вдоль предплечья
              "2": {"third": [0, 0, 0],   "first": [0, 0, 0]},     # везде без поворота
              "3": {"third": [-90, 0, 0], "first": [-90, 0, 0]},   # ствол вдоль предплечья в обоих видах
              "4": {"third": [0, -90, 0], "first": [0, -90, 0]},   # ствол вбок (по оси X руки)
          }
          GRIP = {"glock_17": (0, -4, 0), "mp5": (0, -4, -2), "ak_47": (0, -4, 0), "awm": (0, -5, 3)}
          SCALE = {"glock_17": 1.2, "mp5": 0.8, "ak_47": 0.7, "awm": 0.6}
          EXTRA = {wid: {"first": [0, 0, 0], "third": [0, 0, 0]} for wid in GRIP}

          def _rot(v, r):
              x, y, z = v
              a = math.radians(r[0])
              y, z = y * math.cos(a) - z * math.sin(a), y * math.sin(a) + z * math.cos(a)
              b = math.radians(r[1])
              x, z = x * math.cos(b) + z * math.sin(b), -x * math.sin(b) + z * math.cos(b)
              return [x, y, z]

          def _hold():
              preset = PRESETS.get(os.environ.get("HOLD_PRESET", "1"), PRESETS["1"])
              res = {}
              for wid in GRIP:
                  s = SCALE[wid]
                  res[wid] = {}
                  for view in ("first", "third"):
                      rot = preset[view]
                      g = _rot(GRIP[wid], rot)
                      pos = [round(-s * g[i] + EXTRA[wid][view][i], 2) for i in range(3)]
                      res[wid][view] = {"pos": pos, "rot": rot, "scale": s}
              return res

          HOLD = _hold()

          PALETTE = {
              "slide": (58, 60, 66), "frame": (34, 34, 38), "grip": (44, 40, 38), "metal": (128, 130, 138),
              "dark": (20, 20, 24), "wood": (139, 90, 48), "woodd": (100, 64, 34), "olive": (78, 88, 62),
              "scope": (26, 28, 36), "lens": (90, 160, 210), "brass": (214, 172, 64), "steel": (92, 96, 104),
              "copper": (184, 102, 56),
          }
          ORDER = list(PALETTE)

          def C(o, s, col, pivot=None, rot=None):
              return {"o": o, "s": s, "col": col, "pivot": pivot, "rot": rot}

          # Ствол направлен в -Z, верх +Y. Единицы = 1/16 блока.
          WEAPONS = {
              "glock_17": [
                  C([-1, -1, -9], [2, 1, 9], "frame"),
                  C([-1, 0, -11], [2, 3, 12], "slide"),
                  C([-0.5, 0.5, -12], [1, 1, 1], "metal"),
                  C([-0.25, 3, -11], [0.5, 1, 1], "dark"),
