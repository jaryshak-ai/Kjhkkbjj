name: Build Guns

on:
  workflow_dispatch:
    inputs:
      hold_preset:
        description: 'Пресет положения оружия в руке (1-4), см. PRESETS в gen_pack.py'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3', '4']
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------------
      # 1. Проект: pom.xml, plugin.yml, config.yml, weapons.yml
      # ------------------------------------------------------------------
      - name: Write project descriptors
        run: |
          set -e
          mkdir -p src/main/java/ru/eclips/guns src/main/resources staging

          cat > pom.xml <<'POM_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>ru.eclips</groupId>
            <artifactId>Guns</artifactId>
            <version>1.0.0</version>
            <packaging>jar</packaging>
            <properties>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
              <repository>
                <id>lanink</id>
                <url>https://repo.lanink.cn/repository/maven-public/</url>
                <releases><enabled>true</enabled></releases>
                <snapshots><enabled>true</enabled></snapshots>
              </repository>
              <repository>
                <id>opencollab-snapshots</id>
                <url>https://repo.opencollab.dev/maven-snapshots/</url>
                <releases><enabled>true</enabled></releases>
                <snapshots><enabled>true</enabled></snapshots>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>cn.nukkit</groupId>
                <artifactId>Nukkit</artifactId>
                <version>MOT-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <finalName>Guns</finalName>
              <resources>
                <resource>
                  <directory>src/main/resources</directory>
                  <filtering>false</filtering>
                </resource>
              </resources>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.11.0</version>
                  <configuration>
                    <source>17</source>
                    <target>17</target>
                    <encoding>UTF-8</encoding>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          POM_EOF

          cat > src/main/resources/plugin.yml <<'PLUGIN_EOF'
          name: Guns
          main: ru.eclips.guns.Guns
          version: 1.0.0
          api: ["1.0.0"]
          author: eclips
          description: 3D firearms (hitscan) with custom items and resource pack
          load: STARTUP
          softdepend: [MyRegions]
          commands:
            gun:
              description: Guns administration
              usage: /gun <give|reload>
              permission: gun.admin
          permissions:
            gun.admin:
              description: Guns administration (give, reload)
              default: false
          PLUGIN_EOF

          cat > src/main/resources/config.yml <<'CONFIG_EOF'
          # Миры, где стрельба запрещена (без учёта регистра)
          disabled_worlds:
            - hub

          # Автоогонь: сколько мс после последнего клика ПКМ считать, что кнопка удерживается
          auto_hold_timeout_ms: 300

          # Доля высоты цели сверху, попадание в которую считается выстрелом в голову (0.8 = верхние 20%)
          headshot_fraction: 0.8

          # Показывать магазин/запас над хотбаром
          hud: true

          # /gun give <ник> <оружие>: выдавать вместе с оружием патроны в количестве reserve из weapons.yml
          give_reserve_with_weapon: false

          messages:
            no_ammo: "§cНет патронов: {ammo}"
            reloading: "§eПерезарядка..."
            reloaded: "§aПерезаряжено"
            reload_cancelled: "§cПерезарядка отменена"
            empty: "§cМагазин пуст. Выбросьте оружие (Q) для перезарядки"
            full: "§7Магазин полон"
            no_fire_zone: "§cЗдесь стрелять нельзя"
            no_perm: "§cНет прав"
            no_player: "§cИгрок {player} не найден"
            unknown_item: "§cНеизвестный предмет: {id}"
            bad_count: "§cКоличество должно быть от 1 до 576"
            usage: "§cИспользование: /gun give <ник> <оружие|патроны> [количество] | /gun reload"
            given: "§aВыдано {player}: {id} x{count}"
            reloaded_cfg: "§aКонфиги Guns перезагружены"
          CONFIG_EOF

          cat > src/main/resources/weapons.yml <<'WEAPONS_EOF'
          # Весь урон в HP (20 HP = 10 сердец). Изменения применяются командой /gun reload.
          # Перезагружаются: урон, магазин, скорострельность, разброс, отдача, звуки, эффекты.
          # НЕ перезагружаются без рестарта: идентификаторы, названия и размер стака (регистрируются один раз).
          #
          # mode: semi (один выстрел за клик) | auto (удержание) | bolt (затворная)
          # shots_per_second: максимальная скорострельность (AWM 0.5 = раз в 2 секунды)
          # spread: градусы. base - в покое, per_shot - прирост за выстрел очереди, max - потолок,
          #         recover_ms - пауза, после которой разброс сбрасывается
          # recoil: pitch - подброс прицела вверх за выстрел (градусы), yaw - случайный увод вбок
          # trail: none | smoke | flame | critical; trail_step - шаг частиц вдоль луча (блоки)
          reserve_note: "reserve - справочное число патронов (используется при give_reserve_with_weapon)"

          ammo:
            "eclips:ammo_9x19":
              name: "Патроны 9x19 мм"
            "eclips:ammo_762x39":
              name: "Патроны 7.62x39 мм"
            "eclips:ammo_338_lapua":
              name: "Патроны .338 Lapua Magnum"

          weapons:
            "eclips:glock_17":
              name: "Glock 17"
              ammo: "eclips:ammo_9x19"
              damage: 5
              headshot_multiplier: 1.5
              magazine: 17
              reserve: 68
              mode: semi
              shots_per_second: 3
              reload_seconds: 1.5
              range: 40
              spread:
                base: 0.4
                per_shot: 0.0
                max: 0.4
                recover_ms: 300
              recoil:
                pitch: 1.5
                yaw: 0.3
              scope:
                enabled: false
              sounds:
                shot: "eclips.glock_17.shot"
                empty: "eclips.gun.empty"
                reload: "eclips.glock_17.reload"
              effects:
                muzzle_flash: true
                trail: smoke
                trail_step: 3.0

            "eclips:mp5":
              name: "MP5"
              ammo: "eclips:ammo_9x19"
              damage: 3
              headshot_multiplier: 1.5
              magazine: 30
              reserve: 120
              mode: auto
              shots_per_second: 10
              reload_seconds: 2.0
              range: 30
              spread:
                base: 0.5
                per_shot: 0.35
                max: 4.0
                recover_ms: 350
              recoil:
                pitch: 0.9
                yaw: 0.4
              scope:
                enabled: false
              sounds:
                shot: "eclips.mp5.shot"
                empty: "eclips.gun.empty"
                reload: "eclips.mp5.reload"
              effects:
                muzzle_flash: true
                trail: critical
                trail_step: 3.0

            "eclips:ak_47":
              name: "AK-47"
              ammo: "eclips:ammo_762x39"
              damage: 5
              headshot_multiplier: 1.5
              magazine: 30
              reserve: 120
              mode: auto
              shots_per_second: 7
              reload_seconds: 2.5
              range: 60
              spread:
                base: 0.6
                per_shot: 0.4
                max: 5.0
                recover_ms: 400
              recoil:
                pitch: 2.2
                yaw: 0.7
              scope:
                enabled: false
              sounds:
                shot: "eclips.ak_47.shot"
                empty: "eclips.gun.empty"
                reload: "eclips.ak_47.reload"
              effects:
                muzzle_flash: true
                trail: flame
                trail_step: 3.5

            "eclips:awm":
              name: "AWM"
              ammo: "eclips:ammo_338_lapua"
              damage: 25
              headshot_multiplier: 2.0
              magazine: 5
              reserve: 20
              mode: bolt
              shots_per_second: 0.5
              reload_seconds: 3.5
              range: 120
              spread:
                base: 3.0
                per_shot: 0.0
                max: 3.0
                recover_ms: 1000
              recoil:
                pitch: 4.0
                yaw: 0.2
              scope:
                enabled: true
                slowness_level: 3
                spread_mult: 0.0
              sounds:
                shot: "eclips.awm.shot"
                empty: "eclips.gun.empty"
                reload: "eclips.awm.reload"
              effects:
                muzzle_flash: true
                trail: smoke
                trail_step: 2.5
          WEAPONS_EOF

      # ------------------------------------------------------------------
      # 2. Java: интерфейсы, конфиг, предметы, логика
      # ------------------------------------------------------------------
      - name: Write Java sources
        run: |
          set -e
          D=src/main/java/ru/eclips/guns

          cat > $D/GunMarker.java <<'JAVA_EOF'
          package ru.eclips.guns;

          /** Маркер для наших кастомных предметов: возвращает идентификатор вида eclips:glock_17. */
          public interface GunMarker {
              String gunId();
          }
          JAVA_EOF

          cat > $D/Weapon.java <<'JAVA_EOF'
          package ru.eclips.guns;

          public final class Weapon {
              public enum Mode { SEMI, AUTO, BOLT }

              public String id;
              public String name;
              public String ammoId;
              public double damage;
              public double headMult;
              public int magazine;
              public int reserve;
              public Mode mode = Mode.SEMI;
              public long intervalMs;
              public long reloadMs;
              public double range;
              public double spreadBase;
              public double spreadPerShot;
              public double spreadMax;
              public long spreadRecoverMs;
              public double recoilPitch;
              public double recoilYaw;
              public boolean scope;
              public int scopeSlowness;
              public double scopedSpreadMult;
              public String soundShot;
              public String soundEmpty;
              public String soundReload;
              public boolean muzzleFlash;
              public String trail;
              public double trailStep;
          }
          JAVA_EOF

          cat > $D/WeaponRegistry.java <<'JAVA_EOF'
          package ru.eclips.guns;

          import cn.nukkit.utils.Config;
          import cn.nukkit.utils.ConfigSection;

          import java.io.File;
          import java.util.*;

          public final class WeaponRegistry {
              public static final String[] AMMO_IDS = {
                      "eclips:ammo_9x19", "eclips:ammo_762x39", "eclips:ammo_338_lapua"
              };
              private static final String[] AMMO_DEFAULT_NAMES = {
                      "Патроны 9x19 мм", "Патроны 7.62x39 мм", "Патроны .338 Lapua Magnum"
              };

              private final Guns plugin;
              private final Map<String, Weapon> weapons = new LinkedHashMap<>();
              private final Map<String, String> ammoNames = new LinkedHashMap<>();

              public WeaponRegistry(Guns plugin) {
                  this.plugin = plugin;
              }

              public void load() {
                  Map<String, Weapon> newWeapons = new LinkedHashMap<>();
                  Map<String, String> newAmmo = new LinkedHashMap<>();
                  for (int i = 0; i < AMMO_IDS.length; i++) newAmmo.put(AMMO_IDS[i], AMMO_DEFAULT_NAMES[i]);
                  try {
                      Config cfg = new Config(new File(plugin.getDataFolder(), "weapons.yml"), Config.YAML);
                      ConfigSection ammo = cfg.getSection("ammo");
                      for (String id : ammo.getKeys(false)) {
                          newAmmo.put(id, ammo.getSection(id).getString("name", id));
                      }
                      ConfigSection ws = cfg.getSection("weapons");
                      for (String id : ws.getKeys(false)) {
                          try {
                              newWeapons.put(id, parse(id, ws.getSection(id)));
                          } catch (Exception e) {
                              plugin.getLogger().error("weapons.yml: ошибка в оружии " + id + ": " + e);
                          }
                      }
                  } catch (Exception e) {
                      plugin.getLogger().error("Не удалось прочитать weapons.yml: " + e);
                      return;
                  }
                  weapons.clear();
                  weapons.putAll(newWeapons);
                  ammoNames.clear();
                  ammoNames.putAll(newAmmo);
              }

              private static double num(ConfigSection s, String key, double def) {
                  Object o = s.get(key);
                  return o instanceof Number ? ((Number) o).doubleValue() : def;
              }

              private Weapon parse(String id, ConfigSection s) {
                  Weapon w = new Weapon();
                  w.id = id;
                  w.name = s.getString("name", id);
                  w.ammoId = s.getString("ammo", "");
                  w.damage = num(s, "damage", 5);
                  w.headMult = num(s, "headshot_multiplier", 1.5);
                  w.magazine = Math.max(1, (int) num(s, "magazine", 10));
                  w.reserve = Math.max(0, (int) num(s, "reserve", 0));
                  String m = s.getString("mode", "semi").toLowerCase(Locale.ROOT);
                  w.mode = m.equals("auto") ? Weapon.Mode.AUTO : m.equals("bolt") ? Weapon.Mode.BOLT : Weapon.Mode.SEMI;
                  double sps = Math.max(0.1, num(s, "shots_per_second", 2));
                  w.intervalMs = (long) (1000.0 / sps);
                  w.reloadMs = (long) (num(s, "reload_seconds", 2) * 1000);
                  w.range = Math.max(5, num(s, "range", 40));

                  ConfigSection sp = s.getSection("spread");
                  w.spreadBase = num(sp, "base", 0.5);
                  w.spreadPerShot = num(sp, "per_shot", 0);
                  w.spreadMax = Math.max(w.spreadBase, num(sp, "max", w.spreadBase));
                  w.spreadRecoverMs = (long) num(sp, "recover_ms", 300);

                  ConfigSection rc = s.getSection("recoil");
                  w.recoilPitch = num(rc, "pitch", 1);
                  w.recoilYaw = num(rc, "yaw", 0.2);

                  ConfigSection sc = s.getSection("scope");
                  Object en = sc.get("enabled");
                  w.scope = en instanceof Boolean && (Boolean) en;
                  w.scopeSlowness = (int) num(sc, "slowness_level", 3);
                  w.scopedSpreadMult = num(sc, "spread_mult", 0.0);

                  ConfigSection so = s.getSection("sounds");
                  w.soundShot = so.getString("shot", "");
                  w.soundEmpty = so.getString("empty", "random.click");
                  w.soundReload = so.getString("reload", "");

                  ConfigSection fx = s.getSection("effects");
                  Object mf = fx.get("muzzle_flash");
                  w.muzzleFlash = !(mf instanceof Boolean) || (Boolean) mf;
                  w.trail = fx.getString("trail", "smoke").toLowerCase(Locale.ROOT);
                  w.trailStep = num(fx, "trail_step", 3.0);
                  return w;
              }

              public Weapon weapon(String id) { return id == null ? null : weapons.get(id); }
              public Collection<Weapon> weapons() { return weapons.values(); }
              public boolean isAmmo(String id) { return id != null && ammoNames.containsKey(id); }
              public String ammoName(String id) { return ammoNames.getOrDefault(id, id); }
          }
          JAVA_EOF

          cat > $D/GunItems.java <<'JAVA_EOF'
          package ru.eclips.guns;

          import cn.nukkit.item.Item;
          import cn.nukkit.nbt.tag.CompoundTag;

          /** Создание предметов и работа с NBT (идентификатор и магазин). */
          public final class GunItems {
              public static final String TAG_ID = "eclips_id";
              public static final String TAG_MAG = "eclips_mag";

              private GunItems() {}

              /** Идентификатор нашего предмета или null. Работает и для предметов из креатива (без NBT). */
              public static String idOf(Item item) {
                  if (item == null || item.isNull()) return null;
                  if (item instanceof GunMarker) return ((GunMarker) item).gunId();
                  CompoundTag t = item.getNamedTag();
                  if (t != null && t.contains(TAG_ID)) return t.getString(TAG_ID);
                  return null;
              }

              /** Патронов в магазине. Нет тега (предмет из креатива) = полный магазин. */
              public static int mag(Item item, Weapon w) {
                  CompoundTag t = item.getNamedTag();
                  if (t != null && t.contains(TAG_MAG)) {
                      return Math.max(0, Math.min(w.magazine, t.getInt(TAG_MAG)));
                  }
                  return w.magazine;
              }

              public static Item withMag(Item item, int mag) {
                  CompoundTag t = item.getNamedTag();
                  if (t == null) t = new CompoundTag();
                  t.putInt(TAG_MAG, mag);
                  item.setNamedTag(t);
                  return item;
              }

              private static void tagId(Item item, String id) {
                  CompoundTag t = item.getNamedTag();
                  if (t == null) t = new CompoundTag();
                  t.putString(TAG_ID, id);
                  item.setNamedTag(t);
              }

              public static Item weapon(Weapon w) {
                  Item it = CustomItems.create(w.id);
                  if (it == null) it = fallback(w.id, w.name);
                  it.setCount(1);
                  tagId(it, w.id);
                  withMag(it, w.magazine);
                  return it;
              }

              public static Item ammo(String id, int count, String displayName) {
                  Item it = CustomItems.create(id);
                  if (it == null) it = fallback(id, displayName);
                  it.setCount(Math.max(1, Math.min(64, count)));
                  tagId(it, id);
                  return it;
              }

              /** Запасной вариант, если кастомные предметы не зарегистрировались: ванильные предметы с NBT. */
              private static Item fallback(String id, String name) {
                  int legacy;
                  switch (id) {
                      case "eclips:glock_17": legacy = 291; break;   // каменная мотыга
                      case "eclips:mp5": legacy = 292; break;        // железная мотыга
                      case "eclips:ak_47": legacy = 294; break;      // золотая мотыга
                      case "eclips:awm": legacy = 293; break;        // алмазная мотыга
                      case "eclips:ammo_9x19": legacy = 452; break;  // железный самородок
                      case "eclips:ammo_762x39": legacy = 371; break;// золотой самородок
                      default: legacy = 289; break;                  // порох
                  }
                  Item it = Item.get(legacy);
                  it.setCustomName("§r§f" + name);
                  return it;
              }
          }
          JAVA_EOF

          cat > $D/RegionAdapter.java <<'JAVA_EOF'
          package ru.eclips.guns;

          import cn.nukkit.Player;
          import cn.nukkit.math.Vector3;

          /**
           * Адаптер интеграции с MyRegions.
           *
           * API MyRegions мне не известно, поэтому здесь РАБОЧАЯ ЗАГЛУШКА: стрельба везде разрешена.
           * Всё, что нужно подключить вручную, находится ТОЛЬКО в методе isPvpAllowed().
           */
          public final class RegionAdapter {
              /** Поменяйте на true после подключения реального API (используется только для лога). */
              public static final boolean INTEGRATED = false;

              private final Guns plugin;

              public RegionAdapter(Guns plugin) {
                  this.plugin = plugin;
                  if (!INTEGRATED) {
                      plugin.getLogger().warning("MyRegions: интеграция не подключена (заглушка), стрельба в регионах без PvP НЕ блокируется. См. RegionAdapter.isPvpAllowed().");
                  }
              }

              /**
               * HOOK: вернуть false, если в точке {@code at} регион MyRegions с выключенным PvP-флагом.
               * Вызывается для позиции стрелка перед выстрелом и для позиции цели перед нанесением урона.
               * Пример (псевдокод, НЕ реальный API): region = MyRegions.getRegionAt(at); return region == null || region.getFlag("pvp");
               */
              public boolean isPvpAllowed(Player shooter, Vector3 at) {
                  return true;
              }
          }
          JAVA_EOF

          cat > $D/Reflect.java <<'JAVA_EOF'
          package ru.eclips.guns;

          import java.lang.reflect.Field;

          final class Reflect {
              private Reflect() {}

              /** Тихо выставляет int-поле (ищет по иерархии классов). Нужен, чтобы сбросить кадры неуязвимости после урона. */
              static void setInt(Object o, String name, int value) {
                  Class<?> c = o.getClass();
                  while (c != null) {
                      try {
                          Field f = c.getDeclaredField(name);
                          f.setAccessible(true);
                          if (f.getType() == int.class) f.setInt(o, value);
                          return;
                      } catch (NoSuchFieldException e) {
                          c = c.getSuperclass();
                      } catch (Throwable t) {
                          return;
                      }
                  }
              }
          }
          JAVA_EOF

          cat > $D/Fx.java <<'JAVA_EOF'
          package ru.eclips.guns;

          import cn.nukkit.Player;
          import cn.nukkit.level.Level;
          import cn.nukkit.level.particle.CriticalParticle;
          import cn.nukkit.level.particle.FlameParticle;
          import cn.nukkit.level.particle.Particle;
          import cn.nukkit.level.particle.SmokeParticle;
          import cn.nukkit.math.Vector3;
          import cn.nukkit.network.protocol.MovePlayerPacket;
          import cn.nukkit.network.protocol.PlaySoundPacket;

          /** Звуки, частицы, отдача. */
          public final class Fx {
              private Fx() {}

              public static void sound(Player src, String name, float volume, float pitch) {
                  if (name == null || name.isEmpty()) return;
                  Level lv = src.getLevel();
                  for (Player o : lv.getPlayers().values()) {
                      if (o.distanceSquared(src) > 64 * 64) continue;
                      PlaySoundPacket pk = new PlaySoundPacket();
                      pk.name = name;
                      pk.x = (int) src.getX();
                      pk.y = (int) src.getY();
                      pk.z = (int) src.getZ();
                      pk.volume = volume;
                      pk.pitch = pitch;
                      o.dataPacket(pk);
                  }
              }

              public static void trail(Level lv, Weapon w, double ex, double ey, double ez,
                                       double dx, double dy, double dz, double end) {
                  String tp = w.trail;
                  if (tp == null || tp.equals("none")) return;
                  double step = Math.max(0.5, w.trailStep);
                  for (double t = 1.5; t < end; t += step) {
                      Vector3 v = new Vector3(ex + dx * t, ey + dy * t, ez + dz * t);
                      Particle pt;
                      switch (tp) {
                          case "flame": pt = new FlameParticle(v); break;
                          case "critical": pt = new CriticalParticle(v); break;
                          default: pt = new SmokeParticle(v); break;
                      }
                      lv.addParticle(pt);
                  }
              }

              public static void muzzle(Level lv, Weapon w, double yawDeg, double ex, double ey, double ez,
                                        double dx, double dy, double dz) {
                  if (!w.muzzleFlash) return;
                  double yr = Math.toRadians(yawDeg);
                  double rx = -Math.cos(yr), rz = -Math.sin(yr);
                  Vector3 m = new Vector3(ex + dx * 1.0 + rx * 0.2, ey + dy * 1.0 - 0.2, ez + dz * 1.0 + rz * 0.2);
                  lv.addParticle(new FlameParticle(m));
                  lv.addParticle(new SmokeParticle(m));
              }

              /** Отдача: подбрасывает прицел вверх и немного в сторону, синхронизирует камеру клиента. */
              public static void recoil(Player p, double pitchKick, double yawKick) {
                  float np = (float) Math.max(-90.0, p.getPitch() - pitchKick);
                  float ny = (float) (p.getYaw() + (Math.random() * 2 - 1) * yawKick);
                  p.setRotation(ny, np);
                  MovePlayerPacket pk = new MovePlayerPacket();
                  pk.eid = p.getId();
                  pk.x = (float) p.getX();
                  pk.y = (float) (p.getY() + p.getEyeHeight());
                  pk.z = (float) p.getZ();
                  pk.yaw = ny;
                  pk.headYaw = ny;
                  pk.pitch = np;
                  pk.mode = MovePlayerPacket.MODE_PITCH;
                  pk.onGround = p.isOnGround();
                  p.dataPacket(pk);
              }
          }
