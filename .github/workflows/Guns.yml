                  C([-1.2, -3, 20], [2.4, 6, 1.5], "dark"),
                  C([-1, -8, 2], [2, 6, 2.5], "olive", [0, -2, 2], [-15, 0, 0]),
                  C([-1.5, -3, -24], [0.6, 3, 0.6], "dark"),
                  C([0.9, -3, -24], [0.6, 3, 0.6], "dark"),
              ],
          }

          NAMES = {
              "glock_17": ("Glock 17", "Glock 17"),
              "mp5": ("MP5", "MP5"),
              "ak_47": ("AK-47", "AK-47"),
              "awm": ("AWM", "AWM"),
              "ammo_9x19": ("9x19mm Ammo", "Патроны 9x19 мм"),
              "ammo_762x39": ("7.62x39mm Ammo", "Патроны 7.62x39 мм"),
              "ammo_338_lapua": (".338 Lapua Magnum Ammo", "Патроны .338 Lapua Magnum"),
          }

          def w(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              mode = "wb" if isinstance(data, bytes) else "w"
              with open(path, mode, **({} if mode == "wb" else {"encoding": "utf-8"})) as f:
                  f.write(data)

          def wjson(path, obj):
              w(path, json.dumps(obj, indent=2, ensure_ascii=False))

          def write_png(path, width, height, rows):
              raw = b"".join(b"\x00" + bytes([v for px in row for v in px]) for row in rows)
              def chunk(t, d):
                  return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              data = (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
                      + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b""))
              w(path, data)

          # ---------------- геометрия / attachable / анимации ----------------
          def geometry(wid, cubes):
              out = []
              for c in cubes:
                  i = ORDER.index(c["col"])
                  face = {"uv": [i, 0], "uv_size": [1, 1]}
                  cube = {"origin": c["o"], "size": c["s"],
                          "uv": {k: dict(face) for k in ("north", "east", "south", "west", "up", "down")}}
                  if c["rot"]:
                      cube["pivot"] = c["pivot"]
                      cube["rotation"] = c["rot"]
                  out.append(cube)
              return {"format_version": "1.12.0", "minecraft:geometry": [{
                  "description": {"identifier": "geometry.eclips_" + wid, "texture_width": 16, "texture_height": 16,
                                  "visible_bounds_width": 6, "visible_bounds_height": 6, "visible_bounds_offset": [0, 0, 0]},
                  "bones": [{"name": "gun", "pivot": [0, 0, 0], "cubes": out}]}]}

          def attachable(wid):
              return {"format_version": "1.10.0", "minecraft:attachable": {"description": {
                  "identifier": "eclips:" + wid,
                  "materials": {"default": "entity_alpha", "enchanted": "entity_alpha_glint"},
                  "textures": {"default": "textures/attachables/" + wid, "enchanted": "textures/misc/enchanted_item_glint"},
                  "geometry": {"default": "geometry.eclips_" + wid},
                  "animations": {"hold_first_person": "animation.eclips.%s.hold_first_person" % wid,
                                 "hold_third_person": "animation.eclips.%s.hold_third_person" % wid},
                  "scripts": {"animate": [{"hold_first_person": "context.is_first_person == 1.0"},
                                          {"hold_third_person": "context.is_first_person == 0.0"}]},
                  "render_controllers": ["controller.render.item_default"]}}}

          def animations(wid):
              h = HOLD[wid]
              def anim(v):
                  s = v["scale"]
                  return {"loop": True, "bones": {"gun": {"position": v["pos"], "rotation": v["rot"], "scale": [s, s, s]}}}
              return {"format_version": "1.8.0", "animations": {
                  "animation.eclips.%s.hold_first_person" % wid: anim(h["first"]),
                  "animation.eclips.%s.hold_third_person" % wid: anim(h["third"])}}

          # ---------------- текстуры ----------------
          def palette_texture(path):
              rnd = random.Random(7)
              rows = []
              for y in range(16):
                  row = []
                  for x in range(16):
                      if x < len(ORDER):
                          r, g, b = PALETTE[ORDER[x]]
                          n = 0 if y == 0 else rnd.randint(-4, 4)
                          row.append((max(0, min(255, r + n)), max(0, min(255, g + n)), max(0, min(255, b + n)), 255))
                      else:
                          row.append((255, 0, 255, 255))
                  rows.append(row)
              write_png(path, 16, 16, rows)

          def project(c):
              ox, oy, oz = c["o"]
              sx, sy, sz = c["s"]
              pts = [(oy, oz), (oy + sy, oz), (oy + sy, oz + sz), (oy, oz + sz)]
              if c["rot"]:
                  a = math.radians(c["rot"][0])
                  py, pz = c["pivot"][1], c["pivot"][2]
                  npts = []
                  for (y, z) in pts:
                      dy, dz = y - py, z - pz
                      npts.append((py + dy * math.cos(a) - dz * math.sin(a), pz + dy * math.sin(a) + dz * math.cos(a)))
                  pts = npts
              return [(-z, -y) for (y, z) in pts]

          def inside(poly, px, py):
              pos = neg = False
              n = len(poly)
              for i in range(n):
                  x1, y1 = poly[i]
                  x2, y2 = poly[(i + 1) % n]
                  cr = (x2 - x1) * (py - y1) - (y2 - y1) * (px - x1)
                  if cr > 0: pos = True
                  if cr < 0: neg = True
              return not (pos and neg)

          def outline(grid, size):
              res = [row[:] for row in grid]
              for y in range(size):
                  for x in range(size):
                      if grid[y][x] is None:
                          for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                              nx, ny = x + dx, y + dy
                              if 0 <= nx < size and 0 <= ny < size and grid[ny][nx] is not None:
                                  res[y][x] = (10, 10, 12)
                                  break
              return res

          def grid_to_rows(grid, size):
              return [[(g[0], g[1], g[2], 255) if g else (0, 0, 0, 0) for g in row] for row in grid]

          def render_icon(cubes, size=32):
              polys = [(project(c), c["col"]) for c in cubes]
              us = [p[0] for poly, _ in polys for p in poly]
              vs = [p[1] for poly, _ in polys for p in poly]
              umin, umax, vmin, vmax = min(us), max(us), min(vs), max(vs)
              scale = min(28.0 / (umax - umin), 28.0 / (vmax - vmin))
              ou = (size - (umax - umin) * scale) / 2
              ov = (size - (vmax - vmin) * scale) / 2
              grid = [[None] * size for _ in range(size)]
              for poly, col in polys:
                  pp = [((u - umin) * scale + ou, (v - vmin) * scale + ov) for u, v in poly]
                  for y in range(size):
                      for x in range(size):
                          if inside(pp, x + 0.5, y + 0.5):
                              grid[y][x] = PALETTE[col]
              return grid_to_rows(outline(grid, size), size)

          def rect(grid, x, y, wd, ht, col):
              for yy in range(y, y + ht):
                  for xx in range(x, x + wd):
                      if 0 <= xx < 32 and 0 <= yy < 32:
                          grid[yy][xx] = col

          def render_ammo(kind):
              grid = [[None] * 32 for _ in range(32)]
              if kind == "ammo_9x19":
                  n, sp, cw, ch, bw, bh, bcol = 3, 8, 6, 9, 5, 4, "copper"
              elif kind == "ammo_762x39":
                  n, sp, cw, ch, bw, bh, bcol = 3, 9, 7, 12, 6, 6, "steel"
              else:
                  n, sp, cw, ch, bw, bh, bcol = 2, 11, 9, 14, 5, 8, "copper"
              total = (n - 1) * sp + cw
              x0 = (32 - total) // 2
              base = 28
              for i in range(n):
                  cx = x0 + i * sp
                  rect(grid, cx, base - ch, cw, ch, PALETTE["brass"])
                  rect(grid, cx + 1, base - ch, 1, ch, (240, 205, 110))
                  rect(grid, cx - 1, base - 1, cw + 2, 1, PALETTE["brass"])
                  bx = cx + (cw - bw) // 2
                  rect(grid, bx, base - ch - bh, bw, bh, PALETTE[bcol])
                  rect(grid, bx, base - ch - bh, bw, 1, (60, 40, 30))
              return grid_to_rows(outline(grid, 32), 32)

          # ---------------- звуки (синтез) ----------------
          SR = 22050

          def wav(path, samples):
              peak = max(1e-6, max(abs(s) for s in samples))
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with wave.open(path, "wb") as f:
                  f.setnchannels(1)
                  f.setsampwidth(2)
                  f.setframerate(SR)
                  f.writeframes(b"".join(struct.pack("<h", int(max(-1, min(1, s / peak * 0.9)) * 32767)) for s in samples))

          def shot(dur, decay, hz, tdecay, noise, lp, thump, echo=None, seed=1):
              rnd = random.Random(seed)
              n = int(SR * dur)
              out = [0.0] * n
              y = 0.0
              for i in range(n):
                  t = i / SR
                  y += lp * (rnd.uniform(-1, 1) - y)
                  s = noise * y * math.exp(-decay * t)
                  s += thump * math.sin(2 * math.pi * hz * (1 - 0.5 * min(1.0, t * 8)) * t) * math.exp(-tdecay * t)
                  out[i] = s
              if echo:
                  d = int(SR * echo[0])
                  res = out[:]
                  for i in range(d, n):
                      res[i] += echo[1] * out[i - d]
                  out = res
              return out

          def clicks(total, events, seed=3):
              rnd = random.Random(seed)
              n = int(SR * total)
              out = [0.0] * n
              for (t0, hz, amp) in events:
                  start = int(t0 * SR)
                  length = int(0.05 * SR)
                  for i in range(length):
                      if start + i >= n: break
                      t = i / SR
                      out[start + i] += amp * (0.6 * rnd.uniform(-1, 1) + 0.4 * math.sin(2 * math.pi * hz * t)) * math.exp(-90 * t)
              return out

          SOUNDS = {
              "glock_17": dict(shot=shot(0.25, 30, 150, 22, 1.0, 0.55, 0.8, seed=11),
                               reload=clicks(1.5, [(0.2, 900, 0.7), (0.85, 600, 1.0), (1.25, 1400, 0.8)], 5)),
              "mp5": dict(shot=shot(0.22, 34, 130, 24, 1.0, 0.6, 0.7, seed=12),
                          reload=clicks(2.0, [(0.3, 800, 0.7), (1.2, 550, 1.0), (1.7, 1300, 0.8)], 6)),
              "ak_47": dict(shot=shot(0.45, 16, 95, 14, 1.0, 0.35, 1.0, echo=(0.07, 0.3), seed=13),
                            reload=clicks(2.5, [(0.4, 700, 0.8), (1.5, 500, 1.0), (2.1, 1100, 0.9)], 7)),
              "awm": dict(shot=shot(1.2, 7, 55, 5, 1.0, 0.25, 1.3, echo=(0.18, 0.35), seed=14),
                          reload=clicks(3.5, [(0.5, 600, 0.8), (1.2, 1200, 0.9), (2.2, 500, 1.0), (3.0, 900, 0.9)], 8)),
          }

          def main():
              for d in ("textures/attachables", "textures/items", "models/entity", "attachables", "animations",
                        "sounds/guns", "texts"):
                  os.makedirs(os.path.join(OUT, d), exist_ok=True)

              wjson(OUT + "/manifest.json", {
                  "format_version": 2,
                  "header": {"name": "Guns", "description": "Guns resource pack (models, textures, sounds)",
                             "uuid": PACK_UUID, "version": VERSION, "min_engine_version": [1, 21, 0]},
                  "modules": [{"type": "resources", "uuid": MODULE_UUID, "version": VERSION}]})

              palette_texture(OUT + "/textures/palette.png")
              item_tex = {}
              for wid, cubes in WEAPONS.items():
                  wjson("%s/models/entity/%s.geo.json" % (OUT, wid), geometry(wid, cubes))
                  wjson("%s/attachables/%s.json" % (OUT, wid), attachable(wid))
                  wjson("%s/animations/%s.animation.json" % (OUT, wid), animations(wid))
                  palette_texture("%s/textures/attachables/%s.png" % (OUT, wid))
                  write_png("%s/textures/items/%s.png" % (OUT, wid), 32, 32, render_icon(cubes))
                  item_tex[wid] = {"textures": "textures/items/" + wid}
              for aid in ("ammo_9x19", "ammo_762x39", "ammo_338_lapua"):
                  write_png("%s/textures/items/%s.png" % (OUT, aid), 32, 32, render_ammo(aid))
                  item_tex[aid] = {"textures": "textures/items/" + aid}
              wjson(OUT + "/textures/item_texture.json", {
                  "resource_pack_name": "guns", "texture_name": "atlas.items", "texture_data": item_tex})
              write_png(OUT + "/pack_icon.png", 32, 32, render_icon(WEAPONS["glock_17"]))

              defs = {}
              for wid, snd in SOUNDS.items():
                  wav("%s/sounds/guns/%s_shot.wav" % (OUT, wid), snd["shot"])
                  wav("%s/sounds/guns/%s_reload.wav" % (OUT, wid), snd["reload"])
                  defs["eclips.%s.shot" % wid] = {"category": "neutral", "max_distance": 64,
                                                  "sounds": [{"name": "sounds/guns/%s_shot" % wid, "volume": 1.0}]}
                  defs["eclips.%s.reload" % wid] = {"category": "neutral", "max_distance": 24,
                                                    "sounds": [{"name": "sounds/guns/%s_reload" % wid, "volume": 0.8}]}
              wav(OUT + "/sounds/guns/empty.wav", clicks(0.12, [(0.0, 1500, 1.0), (0.05, 900, 0.6)], 9))
              defs["eclips.gun.empty"] = {"category": "neutral", "max_distance": 16,
                                          "sounds": [{"name": "sounds/guns/empty", "volume": 0.8}]}
              wjson(OUT + "/sounds/sound_definitions.json", {"format_version": "1.14.0", "sound_definitions": defs})

              wjson(OUT + "/texts/languages.json", ["en_US", "ru_RU"])
              en = ["itemGroup.name.guns=Guns"]
              ru = ["itemGroup.name.guns=Оружие"]
              for k, (e, r) in NAMES.items():
                  for key in ("item.eclips:%s.name" % k, "item.eclips:%s" % k):
                      en.append("%s=%s" % (key, e))
                      ru.append("%s=%s" % (key, r))
              w(OUT + "/texts/en_US.lang", "\n".join(en) + "\n")
              w(OUT + "/texts/ru_RU.lang", "\n".join(ru) + "\n")

              os.makedirs("src/main/resources", exist_ok=True)
              zpath = "src/main/resources/guns_pack.zip"
              with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED) as z:
                  for root, _, files in os.walk(OUT):
                      for fn in sorted(files):
                          full = os.path.join(root, fn)
                          z.write(full, os.path.relpath(full, OUT))
              w("src/main/resources/pack.info", "uuid=%s\nversion=%s\n" % (PACK_UUID, ".".join(map(str, VERSION))))
              print("pack ok:", zpath, os.path.getsize(zpath), "bytes, version", VERSION)

          main()
          PY_EOF
          python3 staging/gen_pack.py

      # ------------------------------------------------------------------
      # 5. Сборка Maven (Java 17). Подбор варианта API кастомных предметов, затем заглушка.
      # ------------------------------------------------------------------
      - name: Build with Maven
        run: |
          set -e
          SRC=src/main/java/ru/eclips/guns/CustomItems.java
          built=0
          n=0
          for imp in cn.nukkit.item.customitem.data.CreativeCategory cn.nukkit.item.customitem.data.ItemCreativeCategory cn.nukkit.item.ItemCreativeCategory; do
            enum="${imp##*.}"
            for grp in 1 0; do
            for tex in 1 0; do
              n=$((n+1))
              sed -e "s|@CATIMPORT@|$imp|" -e "s|@CATENUM@|$enum|" staging/CustomItems.tpl > "$SRC"
              if [ "$grp" = "0" ]; then sed -i '/\/\/GROUP/d' "$SRC"; fi
              if [ "$tex" = "0" ]; then sed -i '/\/\/TEX/d' "$SRC"; fi
              if mvn -B -q -DskipTests clean package > "build_$n.log" 2>&1; then
                echo "::notice::Custom items OK: $imp, creativeGroup=$grp, texture=$tex"
                built=1
                break 3
              else
                echo "Вариант $n ($imp, group=$grp, texture=$tex) не собрался:"
                grep -E "ERROR.*\.java|cannot find symbol|symbol:|location:" "build_$n.log" | head -n 12 || true
              fi
            done
            done
          done
          if [ "$built" = "0" ]; then
            echo "::warning::Кастомные предметы не собрались ни в одном варианте API. Собираю с заглушкой (ванильные предметы с NBT)."
            cp staging/CustomItems.stub "$SRC"
            mvn -B -DskipTests clean package
          fi
          ls -la target/Guns.jar

      - name: Upload Guns.jar
        uses: actions/upload-artifact@v4
        with:
          name: Guns
          path: target/Guns.jar
          if-no-files-found: error
