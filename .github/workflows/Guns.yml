          package ru.eclips.guns;

          import cn.nukkit.Player;
          import cn.nukkit.event.EventHandler;
          import cn.nukkit.event.Listener;
          import cn.nukkit.event.player.PlayerDeathEvent;
          import cn.nukkit.event.player.PlayerDropItemEvent;
          import cn.nukkit.event.player.PlayerInteractEvent;
          import cn.nukkit.event.player.PlayerItemHeldEvent;
          import cn.nukkit.event.player.PlayerQuitEvent;
          import cn.nukkit.event.player.PlayerToggleSneakEvent;
          import cn.nukkit.item.Item;

          public final class GunListener implements Listener {
              private final Guns plugin;
              private final GunManager mgr;

              public GunListener(Guns plugin, GunManager mgr) {
                  this.plugin = plugin;
                  this.mgr = mgr;
              }

              @EventHandler
              public void onInteract(PlayerInteractEvent e) {
                  PlayerInteractEvent.Action a = e.getAction();
                  if (a != PlayerInteractEvent.Action.RIGHT_CLICK_AIR && a != PlayerInteractEvent.Action.RIGHT_CLICK_BLOCK) return;
                  String id = GunItems.idOf(e.getItem());
                  if (id == null) return;
                  e.setCancelled(true);
                  Weapon w = plugin.registry().weapon(id);
                  if (w != null) mgr.onUse(e.getPlayer(), w);
              }

              /** Выброс оружия (Q) = перезарядка. Выбросить оружие из другого слота можно как обычно. */
              @EventHandler
              public void onDrop(PlayerDropItemEvent e) {
                  Player p = e.getPlayer();
                  String dropped = GunItems.idOf(e.getItem());
                  if (dropped == null || plugin.registry().weapon(dropped) == null) return;
                  String held = GunItems.idOf(p.getInventory().getItemInHand());
                  if (!dropped.equals(held)) return;
                  e.setCancelled(true);
                  mgr.startReload(p);
              }

              @EventHandler
              public void onHeld(PlayerItemHeldEvent e) {
                  mgr.onSlotChange(e.getPlayer(), e.getItem());
              }

              @EventHandler
              public void onSneak(PlayerToggleSneakEvent e) {
                  mgr.onSneak(e.getPlayer(), e.isSneaking());
              }

              @EventHandler
              public void onDeath(PlayerDeathEvent e) {
                  mgr.onDeath((Player) e.getEntity());
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  mgr.remove(e.getPlayer());
              }
          }
          JAVA_EOF

          cat > $D/ResourcePackInstaller.java <<'JAVA_EOF'
          package ru.eclips.guns;

          import java.io.File;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.security.MessageDigest;
          import java.util.Properties;

          /** Разворачивает встроенный ресурс-пак в resource_packs сервера (если нет или изменился). */
          final class ResourcePackInstaller {
              private ResourcePackInstaller() {}

              static void install(Guns plugin) {
                  try (InputStream in = plugin.getResource("guns_pack.zip")) {
                      if (in == null) {
                          plugin.getLogger().warning("В jar нет guns_pack.zip, ресурс-пак не развёрнут.");
                          return;
                      }
                      byte[] data = in.readAllBytes();
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      StringBuilder hex = new StringBuilder();
                      for (byte b : md.digest(data)) hex.append(String.format("%02x", b));
                      String hash = hex.toString();

                      String uuid = "?", version = "?";
                      try (InputStream pi = plugin.getResource("pack.info")) {
                          if (pi != null) {
                              Properties pr = new Properties();
                              pr.load(pi);
                              uuid = pr.getProperty("uuid", "?");
                              version = pr.getProperty("version", "?");
                          }
                      }

                      File dir = new File(plugin.getServer().getDataPath(), "resource_packs");
                      dir.mkdirs();
                      File target = new File(dir, "GunsPack.zip");
                      plugin.getDataFolder().mkdirs();
                      File marker = new File(plugin.getDataFolder(), "pack.sha256");
                      String old = marker.exists() ? new String(Files.readAllBytes(marker.toPath()), StandardCharsets.UTF_8).trim() : "";

                      if (target.exists() && old.equals(hash)) {
                          plugin.getLogger().info("Ресурс-пак актуален: " + target.getPath() + " (версия " + version + ")");
                          return;
                      }
                      Files.write(target.toPath(), data);
                      Files.write(marker.toPath(), hash.getBytes(StandardCharsets.UTF_8));
                      plugin.getLogger().info("Ресурс-пак развёрнут: " + target.getPath() + " (версия " + version + ")");
                      plugin.getLogger().warning("ПРОПИШИТЕ пак в resource_packs.yml (uuid " + uuid + ", версия " + version
                              + ") и ПЕРЕЗАПУСТИТЕ сервер: паки читаются при старте.");
                  } catch (Exception e) {
                      plugin.getLogger().error("Не удалось развернуть ресурс-пак: " + e);
                  }
              }
          }
          JAVA_EOF

