          package ru.eclips.guns;

          import cn.nukkit.Player;
          import cn.nukkit.block.Block;
          import cn.nukkit.entity.Entity;
          import cn.nukkit.entity.EntityLiving;
          import cn.nukkit.event.entity.EntityDamageByEntityEvent;
          import cn.nukkit.event.entity.EntityDamageEvent;
          import cn.nukkit.level.Level;
          import cn.nukkit.level.particle.DestroyBlockParticle;
          import cn.nukkit.math.Vector3;

          import java.util.LinkedHashMap;
          import java.util.Map;

          /** Hitscan: мгновенный луч, блоки не пропускает. */
          public final class Ballistics {
              private Ballistics() {}

              public static void shoot(Guns plugin, Player p, Weapon w, double spreadDeg) {
                  Level lv = p.getLevel();
                  double ex = p.getX(), ey = p.getY() + p.getEyeHeight(), ez = p.getZ();
                  double yaw = p.getYaw(), pitch = p.getPitch();
                  if (spreadDeg > 0) {
                      double a = Math.random() * 2 * Math.PI;
                      double r = spreadDeg * Math.sqrt(Math.random());
                      yaw += r * Math.cos(a);
                      pitch += r * Math.sin(a);
                  }
                  double yr = Math.toRadians(yaw), pr = Math.toRadians(pitch);
                  double dx = -Math.sin(yr) * Math.cos(pr);
                  double dy = -Math.sin(pr);
                  double dz = Math.cos(yr) * Math.cos(pr);

                  // 1. Ближайший блок на луче
                  double blockT = w.range;
                  Block hitBlock = null;
                  for (double t = 0.4; t <= w.range; t += 0.2) {
                      Block b = lv.getBlock(new Vector3(Math.floor(ex + dx * t), Math.floor(ey + dy * t), Math.floor(ez + dz * t)));
                      if (b != null && b.getId() != 0 && !b.canPassThrough()) {
                          blockT = t;
                          hitBlock = b;
                          break;
                      }
                  }

                  // 2. Ближайшая живая цель до этого блока
                  Map<Long, Entity> cands = new LinkedHashMap<>();
                  for (Player o : lv.getPlayers().values()) cands.put(o.getId(), o);
                  for (Entity e : lv.getEntities()) cands.put(e.getId(), e);

                  Entity best = null;
                  double bestT = blockT;
                  double bestY = 0;
                  for (Entity e : cands.values()) {
                      if (e == p || !(e instanceof EntityLiving) || !e.isAlive()) continue;
                      if (e instanceof Player && ((Player) e).isSpectator()) continue;
                      double hw = e.getWidth() / 2.0 + 0.1;
                      double h = e.getHeight();
                      double t = slab(ex, ey, ez, dx, dy, dz,
                              e.getX() - hw, e.getY(), e.getZ() - hw,
                              e.getX() + hw, e.getY() + h, e.getZ() + hw, bestT);
                      if (t >= 0 && t < bestT) {
                          best = e;
                          bestT = t;
                          bestY = ey + dy * t;
                      }
                  }

                  // 3. Урон
                  if (best != null && plugin.regions().isPvpAllowed(p, best)) {
                      boolean head = bestY >= best.getY() + best.getHeight() * plugin.headFraction();
                      double dmg = w.damage * (head ? w.headMult : 1.0);
                      EntityDamageByEntityEvent ev = new EntityDamageByEntityEvent(
                              p, best, EntityDamageEvent.DamageCause.ENTITY_ATTACK, (float) dmg, 0f);
                      // сбрасываем кадры неуязвимости, чтобы быстрые очереди (MP5) наносили урон каждым выстрелом
                      Reflect.setInt(best, "attackTime", 0);
                      Reflect.setInt(best, "noDamageTicks", 0);
                      best.attack(ev);
                      Fx.sound(p, "random.orb", 0.5f, head ? 1.8f : 1.2f);
                  }

                  // 4. Эффекты
                  double endT = (best != null) ? bestT : blockT;
                  Fx.muzzle(lv, w, yaw, ex, ey, ez, dx, dy, dz);
                  Fx.trail(lv, w, ex, ey, ez, dx, dy, dz, endT);
                  if (hitBlock != null && best == null) {
                      lv.addParticle(new DestroyBlockParticle(
                              new Vector3(ex + dx * endT, ey + dy * endT, ez + dz * endT), hitBlock));
                  }
              }

              /** Пересечение луча с AABB. Возвращает расстояние до входа или -1. */
              private static double slab(double ox, double oy, double oz, double dx, double dy, double dz,
                                         double minX, double minY, double minZ,
                                         double maxX, double maxY, double maxZ, double maxT) {
                  double tmin = 0, tmax = maxT;
                  double[] o = {ox, oy, oz}, d = {dx, dy, dz};
                  double[] mn = {minX, minY, minZ}, mx = {maxX, maxY, maxZ};
                  for (int i = 0; i < 3; i++) {
                      if (Math.abs(d[i]) < 1e-9) {
                          if (o[i] < mn[i] || o[i] > mx[i]) return -1;
                      } else {
                          double t1 = (mn[i] - o[i]) / d[i];
                          double t2 = (mx[i] - o[i]) / d[i];
                          if (t1 > t2) { double tmp = t1; t1 = t2; t2 = tmp; }
                          tmin = Math.max(tmin, t1);
                          tmax = Math.min(tmax, t2);
                          if (tmin > tmax) return -1;
                      }
                  }
                  return tmin;
              }
          }
          JAVA_EOF

          cat > $D/GunManager.java <<'JAVA_EOF'
          package ru.eclips.guns;

          import cn.nukkit.Player;
          import cn.nukkit.inventory.PlayerInventory;
          import cn.nukkit.item.Item;
          import cn.nukkit.potion.Effect;

          import java.util.HashMap;
          import java.util.Map;

          /** Состояние игроков, стрельба, перезарядка, прицел. */
          public final class GunManager {
              static final class PlayerState {
                  long nextShotAt;
                  long holdUntil;
                  long lastShotAt;
                  long lastWarn;
                  int burst;
                  long reloadEnd;
                  int reloadSlot;
                  String reloadWeapon;
                  boolean scoped;
              }

              private final Guns plugin;
              private final Map<Long, PlayerState> states = new HashMap<>();

              public GunManager(Guns plugin) {
                  this.plugin = plugin;
              }

              private PlayerState st(Player p) {
                  return states.computeIfAbsent(p.getId(), k -> new PlayerState());
              }

              public void remove(Player p) {
                  PlayerState s = states.remove(p.getId());
                  if (s != null && s.scoped) p.removeEffect(Effect.SLOWNESS);
              }

              private Weapon heldWeapon(Player p) {
                  String id = GunItems.idOf(p.getInventory().getItemInHand());
                  return id == null ? null : plugin.registry().weapon(id);
              }

              // ---------------- правила ----------------

              public boolean canShootHere(Player p) {
                  String world = p.getLevel().getName();
                  for (String d : plugin.disabledWorlds()) {
                      if (d.equalsIgnoreCase(world)) return false;
                  }
                  return plugin.regions().isPvpAllowed(p, p);
              }

              // ---------------- события ----------------

              public void onUse(Player p, Weapon w) {
                  PlayerState s = st(p);
                  long now = System.currentTimeMillis();
                  s.holdUntil = (w.mode == Weapon.Mode.AUTO) ? now + plugin.holdMs() : 0;
                  tryFire(p, true);
              }

              public void onSlotChange(Player p, Item newItem) {
                  PlayerState s = states.get(p.getId());
                  if (s != null) {
                      cancelReload(p, s, true);
                      unscope(p, s);
                      s.holdUntil = 0;
                  }
                  String id = GunItems.idOf(newItem);
                  Weapon w = id == null ? null : plugin.registry().weapon(id);
                  if (w != null) hud(p, w, GunItems.mag(newItem, w));
              }

              public void onDeath(Player p) {
                  PlayerState s = states.get(p.getId());
                  if (s != null) {
                      cancelReload(p, s, false);
                      unscope(p, s);
                      s.holdUntil = 0;
                  }
              }

              public void onSneak(Player p, boolean sneaking) {
                  Weapon w = heldWeapon(p);
                  PlayerState s = st(p);
                  if (w == null || !w.scope) {
                      unscope(p, s);
                      return;
                  }
                  if (sneaking && s.reloadEnd == 0) {
                      s.scoped = true;
                      applyScope(p, w);
                  } else {
                      unscope(p, s);
                  }
              }

              // ---------------- стрельба ----------------

              public void tryFire(Player p, boolean click) {
                  Item hand = p.getInventory().getItemInHand();
                  String id = GunItems.idOf(hand);
                  Weapon w = id == null ? null : plugin.registry().weapon(id);
                  if (w == null || !p.isAlive() || p.isSpectator()) return;

                  PlayerState s = st(p);
                  long now = System.currentTimeMillis();
                  if (s.reloadEnd > 0) return;
                  if (now < s.nextShotAt) return;

                  if (!canShootHere(p)) {
                      if (now - s.lastWarn > 1500) {
                          s.lastWarn = now;
                          p.sendActionBar(plugin.msg("no_fire_zone"));
                      }
                      s.nextShotAt = now + 200;
                      return;
                  }

                  int mag = GunItems.mag(hand, w);
                  if (mag <= 0) {
                      Fx.sound(p, w.soundEmpty, 1f, 1f);
                      s.nextShotAt = now + 350;
                      s.holdUntil = 0;
                      if (click || now - s.lastWarn > 1500) {
                          s.lastWarn = now;
                          p.sendActionBar(plugin.msg("empty"));
                      }
                      return;
                  }

                  // разброс растёт в очереди и сбрасывается после паузы
                  if (now - s.lastShotAt > w.spreadRecoverMs) s.burst = 0;
                  double spread = Math.min(w.spreadMax, w.spreadBase + w.spreadPerShot * s.burst);
                  if (s.scoped && w.scope) spread *= w.scopedSpreadMult;
                  s.burst++;
                  s.lastShotAt = now;

                  long base = (w.mode == Weapon.Mode.AUTO && now - s.nextShotAt < 50) ? s.nextShotAt : now;
                  s.nextShotAt = base + w.intervalMs;

                  GunItems.withMag(hand, mag - 1);
                  p.getInventory().setItemInHand(hand);

                  Fx.sound(p, w.soundShot, 1f, 1f);
                  Ballistics.shoot(plugin, p, w, spread);
                  Fx.recoil(p, w.recoilPitch, w.recoilYaw);
                  hud(p, w, mag - 1);
              }

              // ---------------- перезарядка ----------------

              public void startReload(Player p) {
                  Item hand = p.getInventory().getItemInHand();
                  String id = GunItems.idOf(hand);
                  Weapon w = id == null ? null : plugin.registry().weapon(id);
                  if (w == null) return;
                  PlayerState s = st(p);
                  if (s.reloadEnd > 0) return;
                  if (GunItems.mag(hand, w) >= w.magazine) {
                      p.sendActionBar(plugin.msg("full"));
                      return;
                  }
                  if (countAmmo(p, w.ammoId) <= 0) {
                      p.sendActionBar(plugin.msg("no_ammo").replace("{ammo}", plugin.registry().ammoName(w.ammoId)));
                      p.sendMessage(plugin.msg("no_ammo").replace("{ammo}", plugin.registry().ammoName(w.ammoId)));
                      return;
                  }
                  unscope(p, s);
                  s.holdUntil = 0;
                  s.reloadEnd = System.currentTimeMillis() + w.reloadMs;
                  s.reloadSlot = p.getInventory().getHeldItemIndex();
                  s.reloadWeapon = id;
                  Fx.sound(p, w.soundReload, 1f, 1f);
                  p.sendActionBar(plugin.msg("reloading"));
              }

              private void finishReload(Player p, PlayerState s) {
                  String wid = s.reloadWeapon;
                  int slot = s.reloadSlot;
                  s.reloadEnd = 0;
                  s.reloadWeapon = null;
                  PlayerInventory inv = p.getInventory();
                  Item hand = inv.getItemInHand();
                  if (wid == null || !wid.equals(GunItems.idOf(hand)) || inv.getHeldItemIndex() != slot) return;
                  Weapon w = plugin.registry().weapon(wid);
                  if (w == null) return;
                  int mag = GunItems.mag(hand, w);
                  int n = Math.min(w.magazine - mag, countAmmo(p, w.ammoId));
                  if (n <= 0) return;
                  takeAmmo(p, w.ammoId, n);
                  GunItems.withMag(hand, mag + n);
                  inv.setItemInHand(hand);
                  hud(p, w, mag + n);
              }

              private void cancelReload(Player p, PlayerState s, boolean notify) {
                  if (s.reloadEnd > 0) {
                      s.reloadEnd = 0;
                      s.reloadWeapon = null;
                      if (notify) p.sendActionBar(plugin.msg("reload_cancelled"));
                  }
              }

              // ---------------- прицел ----------------

              private void applyScope(Player p, Weapon w) {
                  Effect e = Effect.getEffect(Effect.SLOWNESS);
                  e.setDuration(60).setAmplifier(Math.max(0, w.scopeSlowness)).setVisible(false);
                  p.addEffect(e);
              }

              private void unscope(Player p, PlayerState s) {
                  if (s.scoped) {
                      s.scoped = false;
                      p.removeEffect(Effect.SLOWNESS);
                  }
              }

              // ---------------- тик ----------------

              public void tick(int t) {
                  if (states.isEmpty()) return;
                  long now = System.currentTimeMillis();
                  for (Player p : plugin.getServer().getOnlinePlayers().values()) {
                      PlayerState s = states.get(p.getId());
                      if (s == null) continue;
                      if (s.reloadEnd > 0) {
                          if (now >= s.reloadEnd) {
                              finishReload(p, s);
                          } else if (t % 5 == 0) {
                              Weapon rw = plugin.registry().weapon(s.reloadWeapon);
                              if (rw != null) {
                                  double left = 1.0 - (double) (s.reloadEnd - now) / Math.max(1, rw.reloadMs);
                                  int filled = (int) Math.round(Math.max(0, Math.min(1, left)) * 10);
                                  StringBuilder sb = new StringBuilder("§e").append(plugin.msg("reloading")).append(" §8[§a");
                                  for (int i = 0; i < 10; i++) {
                                      if (i == filled) sb.append("§7");
                                      sb.append('|');
                                  }
                                  p.sendActionBar(sb.append("§8]").toString());
                              }
                          }
                          continue;
                      }
                      Weapon w = heldWeapon(p);
                      if (w == null) {
                          if (s.scoped) unscope(p, s);
                          s.holdUntil = 0;
                          continue;
                      }
                      if (s.scoped && t % 20 == 0) applyScope(p, w);
                      if (w.mode == Weapon.Mode.AUTO && s.holdUntil > now) tryFire(p, false);
                  }
              }

              // ---------------- патроны и HUD ----------------

              public int countAmmo(Player p, String ammoId) {
                  int n = 0;
                  PlayerInventory inv = p.getInventory();
                  for (int i = 0; i < inv.getSize(); i++) {
                      Item it = inv.getItem(i);
                      if (ammoId.equals(GunItems.idOf(it))) n += it.getCount();
                  }
                  return n;
              }

              private void takeAmmo(Player p, String ammoId, int amount) {
                  PlayerInventory inv = p.getInventory();
                  for (int i = 0; i < inv.getSize() && amount > 0; i++) {
                      Item it = inv.getItem(i);
                      if (!ammoId.equals(GunItems.idOf(it))) continue;
                      int take = Math.min(amount, it.getCount());
                      amount -= take;
                      if (take >= it.getCount()) {
                          inv.clear(i);
                      } else {
                          it.setCount(it.getCount() - take);
                          inv.setItem(i, it);
                      }
                  }
              }

              private void hud(Player p, Weapon w, int mag) {
                  if (!plugin.hud()) return;
                  p.sendActionBar("§f" + w.name + " §8| §e" + mag + "§7/§f" + countAmmo(p, w.ammoId));
              }
          }
          JAVA_EOF

