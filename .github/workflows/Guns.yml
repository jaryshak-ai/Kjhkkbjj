              }

              private static Guns instance;
              private WeaponRegistry registry;
              private GunManager manager;
              private RegionAdapter regions;

              private List<String> disabledWorlds = new ArrayList<>();
              private double headFraction = 0.8;
              private long holdMs = 300;
              private boolean hud = true;
              private boolean giveReserve = false;

              public static Guns get() { return instance; }
              public WeaponRegistry registry() { return registry; }
              public RegionAdapter regions() { return regions; }
              public List<String> disabledWorlds() { return disabledWorlds; }
              public double headFraction() { return headFraction; }
              public long holdMs() { return holdMs; }
              public boolean hud() { return hud; }

              public String msg(String key) {
                  return getConfig().getString("messages." + key, DEF.getOrDefault(key, key));
              }

              @Override
              public void onLoad() {
                  instance = this;
                  saveDefaultConfig();
                  saveResource("weapons.yml", false);
                  readSettings();
                  registry = new WeaponRegistry(this);
                  registry.load();
                  regions = new RegionAdapter(this);
                  // Кастомные предметы нужно регистрировать до того, как на сервер зайдут игроки
                  CustomItems.register(this);
              }

              @Override
              public void onEnable() {
                  ResourcePackInstaller.install(this);
                  manager = new GunManager(this);
                  getServer().getPluginManager().registerEvents(new GunListener(this, manager), this);
                  getServer().getScheduler().scheduleRepeatingTask(this, new Task() {
                      @Override
                      public void onRun(int currentTick) {
                          manager.tick(currentTick);
                      }
                  }, 1);
                  getLogger().info("Guns включён. Оружия: " + registry.weapons().size()
                          + ", кастомные предметы: " + (CustomItems.available ? "да" : "НЕТ (запасные ванильные)"));
              }

              private void readSettings() {
                  disabledWorlds = new ArrayList<>(getConfig().getStringList("disabled_worlds"));
                  headFraction = Math.max(0.5, Math.min(0.99, getConfig().getDouble("headshot_fraction", 0.8)));
                  holdMs = Math.max(100, getConfig().getInt("auto_hold_timeout_ms", 300));
                  hud = getConfig().getBoolean("hud", true);
                  giveReserve = getConfig().getBoolean("give_reserve_with_weapon", false);
              }

              @Override
              public boolean onCommand(CommandSender s, Command c, String label, String[] a) {
                  if (!c.getName().equalsIgnoreCase("gun")) return false;
                  if (!s.hasPermission("gun.admin")) {
                      s.sendMessage(msg("no_perm"));
                      return true;
                  }
                  if (a.length == 0) {
                      s.sendMessage(msg("usage"));
                      return true;
                  }
                  if (a[0].equalsIgnoreCase("reload")) {
                      reloadConfig();
                      readSettings();
                      registry.load();
                      s.sendMessage(msg("reloaded_cfg"));
                      return true;
                  }
                  if (a[0].equalsIgnoreCase("give")) {
                      give(s, a);
                      return true;
                  }
                  s.sendMessage(msg("usage"));
                  return true;
              }

              private void give(CommandSender s, String[] a) {
                  if (a.length < 3) {
                      s.sendMessage(msg("usage"));
                      return;
                  }
                  Player t = getServer().getPlayerExact(a[1]);
                  if (t == null) t = getServer().getPlayer(a[1]);
                  if (t == null) {
                      s.sendMessage(msg("no_player").replace("{player}", a[1]));
                      return;
                  }
                  String id = a[2].toLowerCase(Locale.ROOT);
                  if (!id.contains(":")) id = "eclips:" + id;
                  int count = 1;
                  if (a.length >= 4) {
                      try {
                          count = Integer.parseInt(a[3]);
                      } catch (NumberFormatException ex) {
                          s.sendMessage(msg("bad_count"));
                          return;
                      }
                  }
                  if (count < 1 || count > 576) {
                      s.sendMessage(msg("bad_count"));
                      return;
                  }
                  Weapon w = registry.weapon(id);
                  if (w != null) {
                      int n = Math.min(count, 36);
                      for (int i = 0; i < n; i++) giveItem(t, GunItems.weapon(w));
                      if (giveReserve && w.reserve > 0) giveAmmo(t, w.ammoId, w.reserve);
                      count = n;
                  } else if (registry.isAmmo(id)) {
                      giveAmmo(t, id, count);
                  } else {
                      s.sendMessage(msg("unknown_item").replace("{id}", id));
                      return;
                  }
                  s.sendMessage(msg("given").replace("{player}", t.getName()).replace("{id}", id).replace("{count}", String.valueOf(count)));
              }

              private void giveAmmo(Player t, String ammoId, int count) {
                  String name = registry.ammoName(ammoId);
                  while (count > 0) {
                      int n = Math.min(64, count);
                      giveItem(t, GunItems.ammo(ammoId, n, name));
                      count -= n;
                  }
              }

              private void giveItem(Player t, Item item) {
                  Item[] left = t.getInventory().addItem(item);
                  for (Item l : left) t.getLevel().dropItem(t, l);
              }
          }
          JAVA_EOF

      # ------------------------------------------------------------------
      # 3. Кастомные предметы: шаблон + заглушка (подбор варианта при сборке)
      # ------------------------------------------------------------------
      - name: Write custom item templates
        run: |
          set -e

          # Реальная регистрация через Nukkit-MOT. Плейсхолдеры @CATIMPORT@ / @CATENUM@ и строки //GROUP
          # подставляются/удаляются на шаге сборки, если какой-то вариант API не подошёл.
          cat > staging/CustomItems.tpl <<'TPL_EOF'
          package ru.eclips.guns;

          import cn.nukkit.item.Item;
          import cn.nukkit.item.customitem.CustomItemDefinition;
          import cn.nukkit.item.customitem.ItemCustom;
          import @CATIMPORT@;
          import cn.nukkit.plugin.PluginBase;

          import java.lang.reflect.InvocationTargetException;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;

          public final class CustomItems {
              public static boolean available = false;

              private CustomItems() {}

              private static CustomItemDefinition def(ItemCustom item, String tex) {
                  return CustomItemDefinition.simpleBuilder(item, @CATENUM@.EQUIPMENT)
                          .texture(tex) //TEX
                          .creativeGroup("itemGroup.name.guns") //GROUP
                          .build();
              }

              public abstract static class Gun extends ItemCustom implements GunMarker {
                  private final String gid;
                  protected Gun(String id, String name, String tex) { super(id, name, tex); this.gid = id; }
                  @Override public int getMaxStackSize() { return 1; }
                  @Override public String gunId() { return gid; }
              }

              public abstract static class Ammo extends ItemCustom implements GunMarker {
                  private final String gid;
                  protected Ammo(String id, String name, String tex) { super(id, name, tex); this.gid = id; }
                  @Override public int getMaxStackSize() { return 64; }
                  @Override public String gunId() { return gid; }
              }

              public static class Glock17 extends Gun {
                  public Glock17() { super("eclips:glock_17", "Glock 17", "glock_17"); }
                  @Override public CustomItemDefinition getDefinition() { return def(this, "glock_17"); }
              }
              public static class Mp5 extends Gun {
                  public Mp5() { super("eclips:mp5", "MP5", "mp5"); }
                  @Override public CustomItemDefinition getDefinition() { return def(this, "mp5"); }
              }
              public static class Ak47 extends Gun {
                  public Ak47() { super("eclips:ak_47", "AK-47", "ak_47"); }
                  @Override public CustomItemDefinition getDefinition() { return def(this, "ak_47"); }
              }
              public static class Awm extends Gun {
                  public Awm() { super("eclips:awm", "AWM", "awm"); }
                  @Override public CustomItemDefinition getDefinition() { return def(this, "awm"); }
              }
              public static class Ammo9x19 extends Ammo {
                  public Ammo9x19() { super("eclips:ammo_9x19", "9x19mm Ammo", "ammo_9x19"); }
                  @Override public CustomItemDefinition getDefinition() { return def(this, "ammo_9x19"); }
              }
              public static class Ammo762x39 extends Ammo {
                  public Ammo762x39() { super("eclips:ammo_762x39", "7.62x39mm Ammo", "ammo_762x39"); }
                  @Override public CustomItemDefinition getDefinition() { return def(this, "ammo_762x39"); }
              }
              public static class Ammo338 extends Ammo {
                  public Ammo338() { super("eclips:ammo_338_lapua", ".338 Lapua Magnum Ammo", "ammo_338_lapua"); }
                  @Override public CustomItemDefinition getDefinition() { return def(this, "ammo_338_lapua"); }
              }

              /** Порядок важен: он же порядок в креативной группе (иконка группы = Glock 17). */
              public static void register(PluginBase plugin) {
                  List<Class<?>> classes = Arrays.asList(Glock17.class, Mp5.class, Ak47.class, Awm.class,
                          Ammo9x19.class, Ammo762x39.class, Ammo338.class);
                  int ok = 0;
                  for (Class<?> c : classes) {
                      if (callRegister(plugin, c)) ok++;
                      else plugin.getLogger().error("Не удалось зарегистрировать кастомный предмет " + c.getSimpleName());
                  }
                  available = ok == classes.size();
              }

              /** Item.registerCustomItem вызывается через рефлексию: сигнатура (Class или List) зависит от сборки ядра. */
              private static boolean callRegister(PluginBase plugin, Class<?> c) {
                  for (Method m : Item.class.getMethods()) {
                      if (!m.getName().equals("registerCustomItem") || m.getParameterCount() != 1) continue;
                      Class<?> pt = m.getParameterTypes()[0];
                      Object arg;
                      if (pt.isAssignableFrom(Class.class)) arg = c;
                      else if (pt.isAssignableFrom(ArrayList.class)) arg = new ArrayList<Object>(Arrays.asList(c));
                      else continue;
                      try {
                          Object r = m.invoke(null, arg);
                          if (r != null && r.getClass().getSimpleName().equalsIgnoreCase("Error")) {
                              plugin.getLogger().error("registerCustomItem вернул ошибку: " + r);
                              return false;
                          }
                          return true;
                      } catch (InvocationTargetException e) {
                          plugin.getLogger().error("registerCustomItem: " + e.getCause());
                          return false;
                      } catch (Exception e) {
                          plugin.getLogger().error("registerCustomItem: " + e);
                          return false;
                      }
                  }
                  plugin.getLogger().error("Item.registerCustomItem(...) не найден в этом ядре");
                  return false;
              }

              /** Возвращает наш кастомный предмет или null (тогда GunItems берёт запасной ванильный). */
              public static Item create(String id) {
                  if (!available) return null;
                  switch (id) {
                      case "eclips:glock_17": return new Glock17();
                      case "eclips:mp5": return new Mp5();
                      case "eclips:ak_47": return new Ak47();
                      case "eclips:awm": return new Awm();
                      case "eclips:ammo_9x19": return new Ammo9x19();
                      case "eclips:ammo_762x39": return new Ammo762x39();
                      case "eclips:ammo_338_lapua": return new Ammo338();
                      default: return null;
                  }
              }
          }
          TPL_EOF

          # Заглушка: компилируется всегда, кастомные предметы заменяются ванильными с NBT
